<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 패션 코치 - 곽영민 프로젝트</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Chosen Palette: Warm Neutrals (Background: bg-orange-50, Text: text-stone-800, Accent: emerald-700) -->
    <!-- Application Structure Plan: 4-섹션 SPA 구조 (소개, 프로젝트, 기술, 배운 점)를 채택했습니다. README의 선형 구조 대신, 사용자가 관심 있는 주제(예: '기술' 또는 '핵심 기능')로 바로 이동할 수 있도록 상단 고정 탐색 바를 구현했습니다. '프로젝트' 섹션은 탭 인터페이스를 사용하여 아키텍처와 3가지 핵심 기능을 분리, 사용자가 한 번에 하나의 정보에 집중할 수 있게 설계했습니다. 이는 복잡한 앱 기능을 명확하게 전달하는 데 효과적입니다. '기술' 섹션은 Chart.js를 사용해 시각적 요약을 제공하고, '배운 점' 섹션은 카드로 정보를 분리하여 가독성을 높였습니다. 이 구조는 정보 탐색의 유연성과 사용성을 극대화하기 위해 선택되었습니다. -->
    <!-- Visualization & Content Choices:
        - Report Info: 기술 스택 표 (Skills Table)
        - Goal: 기술 스택의 분포를 한눈에 요약하여 보여주기 (Inform, Compare)
        - Viz/Presentation: Bar Chart (Chart.js) + HTML 리스트
        - Interaction: 차트 호버 시 툴팁 표시.
        - Justification: 원본 README의 이미지 배지 목록은 정적인 정보입니다. 이를 Chart.js 바 차트('범주별 기술 수')로 변환하여 프로젝트의 기술적 구성을 시각적으로 요약하고, SPA에 동적 요소를 추가했습니다. 차트만으로는 세부 정보가 부족하므로, 하단에 원본의 모든 기술 스택을 명확한 HTML 리스트로 함께 제공하여 정보의 시각적 요약과 상세 내역을 모두 충족시켰습니다.
        - Library/Method: Chart.js (Canvas)
        - Report Info: 아키텍처 App Flow (Architecture App Flow)
        - Goal: 3-탭 앱의 흐름을 시각적으로 설명 (Organize)
        - Viz/Presentation: HTML/CSS/Tailwind를 사용한 순서도 (Flowchart Diagram)
        - Interaction: 없음 (정적 다이어그램).
        - Justification: 아키텍처 설명은 텍스트만으로는 이해하기 어렵습니다. 원본의 'App Flow' 설명을 Tailwind와 HTML(flexbox, borders)을 사용한 간단한 시각적 다이어그램으로 재구성하여, 사용자가 앱의 작동 순서를 즉각적으로 파악할 수 있도록 했습니다. (SVG/Mermaid 사용 안 함).
        - Report Info: 핵심 기능 1, 2, 3
        - Goal: 상세한 기능 설명을 분리하여 제공 (Organize, Inform)
        - Viz/Presentation: 탭(Tab) 인터페이스 (HTML/JS)
        - Interaction: 탭 클릭 시 해당 기능의 설명만 동적으로 표시.
        - Justification: 3가지 핵심 기능을 한 페이지에 나열하면 정보 과다가 발생합니다. 탭으로 분리하여 사용자가 '아키텍처', '기능 1', '기능 2', '기능 3' 중 원하는 정보만 선택적으로 탐색할 수 있게 하여, 복잡한 내용을 명확하고 구조적으로 전달합니다.
        -->
    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->

    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
        }
        .nav-link {
            @apply text-stone-600 hover:text-emerald-700 transition-colors duration-200;
        }
        .nav-link.active {
            @apply text-emerald-700 font-bold;
        }
        .tab-btn {
            @apply py-3 px-5 text-sm md:text-base font-medium text-stone-500 border-b-2 border-transparent hover:border-stone-300 hover:text-stone-800 focus:outline-none
